<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Transcendence</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23c9a84c'%3E%E2%99%A0%3C/text%3E%3C/svg%3E" />

    <style>
      /* ── Reset & base ── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #150e0a;
        font-family: 'Nunito', 'Trebuchet MS', sans-serif;
        color: #fff1d2;
      }

      /* ── Three.js canvas: fills the viewport ── */
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none; /* prevent scroll interference on mobile */
      }

      /* ── Overlay container: sits on top of the canvas ── */
      /* Managed by src/ui/Overlay.js */
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;  /* passthrough until active */
        z-index: 10;
      }

      /* ── Loading screen ── */
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #4a2a14, #150e0a 70%);
        z-index: 100;
        transition: opacity 0.8s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loading-screen p {
        color: #f7bb2a;
        font-family: 'Lilita One', 'Trebuchet MS', sans-serif;
        font-size: 1.6rem;
        text-shadow: 0 3px 0 #22120a;
        margin-top: 1.6rem;
      }

      /* A spinning poker chip (saloon theme) */
      .spinner {
        width: 76px;
        height: 76px;
        border: 5px solid #22120a;
        border-radius: 50%;
        background:
          radial-gradient(circle, #b52c1c 0 50%, #fff1d2 51% 56%, transparent 57%),
          repeating-conic-gradient(#b52c1c 0 22.5deg, #fff1d2 22.5deg 45deg);
        box-shadow: 0 6px 0 #22120a;
        animation: spin 1.2s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <!-- Three.js renders into this canvas -->
    <canvas id="canvas"></canvas>

    <!-- UI overlays are injected here by Overlay.js -->
    <div id="overlay"></div>

    <!-- Loading screen, hidden once assets are ready -->
    <div id="loading-screen">
      <div class="spinner"></div>
      <p>On mélange les cartes…</p>
    </div>

    <!-- Entry point (ES module) -->
    <script type="module" src="/src/front/main.js"></script>
  </body>
</html>
